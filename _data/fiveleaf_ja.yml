product_name: 「五文字」
product_note: 一日五文字の日記
meta_title: 「五文字」サポート
meta_description: 一日を五文字で残す日記アプリ「五文字」の使い方、よくある質問、お問い合わせ。

hero_eyebrow: サポート
hero_title: ここで解決できます。
hero_body: 五文字の書き方、写真や5秒の動画の添え方、記録の守り方をまとめました。ここで見つからないときは、下の項目を書いてメールでお知らせください。

setup_label: はじめに
setup_note: 最初の一日は、この三つで十分です。
setup_steps:
  - title: きょうを五文字で
    body: Today の画面に、きょうの五文字を書きます。五文字そろうと保存できます。一日にひとつだけ残します。
  - title: 写真か動画を添える
    body: 保存したあと、写真一枚か5秒の動画を添えられます。写真ライブラリ・カメラ・紙から選びます。一日にひとつです。
  - title: バックアップしておく
    body: 設定 ＞ 記録をバックアップ を押すと、iCloud Drive の「FiveLeaf」フォルダにバックアップができます。機種変更のときはこのファイルから戻します。

faq_label: よくある質問
faq:
  - label: 書く
    items:
      - q: なぜ五文字なのですか
        a: 短く書くためです。長く書けると「うまく書こう」としてしまい、そうすると数日でやめてしまいます。五文字は<strong>選ぶこと</strong>なので、毎日つづきます。
      - q: 一日に何度も書けますか
        a: いいえ。一日にひとつです。すでに書いた日は、その記録を直せます。
      - q: いつまで直せますか
        a: <strong>翌日の正午まで</strong>です。夜おそくに書いても、朝起きてから直す時間があります。削除はいつでもできます。
      - q: 文字数の数え方が変です
        a: 変換中の文字（未確定のかな・ハングル）は数えません。確定すると数が増えます。絵文字は見えているとおり一文字です。
      - q: 過去の日付に書き足したい
        a: できません。このアプリに過去を埋める機能はありません — 空いた日も、その日の記録です。
  - label: 写真と動画
    items:
      - q: 動画は何秒までですか
        a: <strong>5秒</strong>です。長い動画を選ぶと、5秒の範囲を自分で決める画面が出ます。音も入ります。
      - q: 写真と動画を両方入れられますか
        a: いいえ。一日の記録は写真か動画の<strong>どちらかひとつ</strong>です。新しく添えると、前のものと入れ替わります。
      - q: フィルターを選ぶと元が変わりますか
        a: いいえ。元はそのまま残し、表示するときにフィルターを重ねます。あとで変えても外しても、元の写真は変わりません。
      - q: 写真のない日もあります
        a: 大丈夫です。かわりに紙を一枚選ぶこともできますし、何も添えなくてもかまいません。
  - label: 記録を守る
    items:
      - q: 機種を変えたら記録もついてきますか
        a: <strong>自動ではついてきません。</strong>記録はこの端末の中だけにあります。機種を変える前に<strong>設定 ＞ 記録をバックアップ</strong>でバックアップを作り、新しい端末で<strong>iCloud Drive から戻す</strong>を押してください。
      - q: バックアップはどこにできますか
        a: iCloud Drive の「FiveLeaf」フォルダです。ファイルアプリから見えて、<strong>アプリを消してもそのファイルは残ります。</strong>バックアップは一つだけ置くので、新しく作ると前のものと入れ替わります。
      - q: どのくらいの頻度でバックアップしますか
        a: 決まった間隔はありません。毎月1日の朝に先月をふり返る知らせが届き、その月にバックアップしていなければ、その一行も添えられます。
      - q: 戻すと今の記録は消えますか
        a: いいえ。復元は<strong>足すだけ</strong>です。同じ日がすでにあれば、その日は飛ばして今あるものをそのままにします。終わったら、何件戻して何件そのままにしたかをお知らせします。
      - q: バックアップを別の場所に置きたい
        a: <strong>設定 ＞ 記録を書き出す</strong>で、同じファイルをどこへでも送れます。そのファイルをアプリで開けば戻せます。
      - q: バックアップには何が入っていますか
        a: 記録のすべてです — 文字・写真・動画・時刻・場所・色。<code>memories.json</code> はただの文字、写真と動画はふつうのファイルなので、「五文字」がなくても開けます。拡張子を <code>.zip</code> に変えれば、どこでも展開できます。
  - label: ロックと通知
    items:
      - q: ある記録だけ隠したい
        a: 詳細画面でロックできます。ロックした日は文字・写真・時刻・場所がすべて隠れ、開くときに Face ID かパスコードで確認します。
      - q: 通知の時刻を変えたい
        a: <strong>設定 ＞ Daily Reminder</strong> で時刻を決めるか、切ります。はじめは夜9時に設定されます。
      - q: 通知が来ません
        a: iPhone の 設定 ＞ 通知 ＞「五文字」で、通知が許可されているか確かめてください。最初に許可しなかった場合も、そこから許可できます。
  - label: プライバシー
    items:
      - q: 記録はサーバーに送られますか
        a: いいえ。このアプリにサーバーはありません。記録はこの端末の中だけにあり、バックアップを作るときだけ、あなたの iCloud Drive に入ります — それもあなたが押したときだけです。
      - q: 場所はどうやって分かるのですか
        a: 位置情報を許可した日だけ、座標を Apple の地図サービスに送って<strong>都市名</strong>を受け取ります。座標と都市名はその記録に保存され、それ以外には出ていきません。
      - q: アプリを消したらどうなりますか
        a: 端末の中の記録は一緒に消えます。<strong>iCloud Drive のバックアップは残ります。</strong>

contact_title: 解決しませんか？
contact_body: 下の内容を添えていただけると、原因をすぐに探せます。記録の内容や個人情報は送らないでください。
contact_checklist:
  - 「五文字」のバージョン（設定 ＞ 情報）
  - iPhone の機種と iOS のバージョン
  - 起きるまでの手順
  - できればスクリーンショット
contact_action: メールで問い合わせる

