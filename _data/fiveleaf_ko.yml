product_name: 「다섯 글자」
product_note: 하루 다섯 글자 일기
meta_title: 「다섯 글자」 고객지원
meta_description: 하루를 다섯 글자로 남기는 일기 앱 「다섯 글자」의 사용법, 자주 묻는 질문, 문의 안내.

hero_eyebrow: 고객지원
hero_title: 궁금한 점을 여기서 해결하세요.
hero_body: 다섯 글자를 쓰는 법, 사진과 영상을 얹는 법, 기록을 지키는 법을 모았습니다. 여기서 답을 찾지 못하면 아래 항목을 적어 메일로 알려주세요.

setup_label: 시작하기
setup_note: 처음 하루는 이 셋이면 충분합니다.
setup_steps:
  - title: 오늘을 다섯 글자로
    body: Today 화면에 오늘의 다섯 글자를 씁니다. 다섯 글자를 채우면 저장할 수 있습니다. 하루에 하나만 남깁니다.
  - title: 사진이나 영상 얹기
    body: 저장한 뒤 사진 한 장이나 5초 영상을 얹을 수 있습니다. 사진첩·카메라·종이 중에서 고릅니다. 하루에 하나입니다.
  - title: 백업해 두기
    body: 설정 ＞ 내 기록 백업하기를 누르면 iCloud Drive 의 「FiveLeaf」 폴더에 백업이 만들어집니다. 기기를 바꿀 때 이 파일로 되살립니다.

faq_label: 자주 묻는 질문
faq:
  - label: 쓰기
    items:
      - q: 왜 다섯 글자인가요
        a: 짧게 쓰기 위해서입니다. 길게 쓸 수 있으면 잘 쓰려고 애쓰게 되고, 애쓰면 며칠 만에 그만두게 됩니다. 다섯 글자는 <strong>고르는 일</strong>이라서 매일 할 수 있습니다.
      - q: 하루에 여러 개 쓸 수 있나요
        a: 아니요. 하루에 하나입니다. 이미 쓴 날에는 그 기록을 고칠 수 있습니다.
      - q: 언제까지 고칠 수 있나요
        a: <strong>다음날 정오까지</strong>입니다. 밤늦게 써도 자고 일어나 고칠 시간이 있습니다. 지우는 것은 언제나 됩니다.
      - q: 글자 수가 이상하게 세어져요
        a: 조합 중인 글자(아직 완성되지 않은 한글·일본어)는 세지 않습니다. 글자가 완성되면 숫자가 올라갑니다. 이모지는 보이는 대로 한 글자입니다.
      - q: 지난 날짜에 기록을 채워 넣고 싶어요
        a: 할 수 없습니다. 이 앱에는 과거를 채우는 기능이 없습니다 — 빈 날은 빈 날대로 그날의 기록입니다.
  - label: 사진과 영상
    items:
      - q: 영상은 얼마나 넣을 수 있나요
        a: <strong>5초</strong>입니다. 더 긴 영상을 고르면 5초 구간을 직접 정하는 화면이 나옵니다. 소리도 함께 담깁니다.
      - q: 사진과 영상을 같이 넣을 수 있나요
        a: 아니요. 하루의 기록은 사진 또는 영상 <strong>하나</strong>입니다. 새로 얹으면 먼저 있던 것을 대신합니다.
      - q: 필터를 고르면 원본이 바뀌나요
        a: 아니요. 원본은 그대로 두고 필터는 보여줄 때 얹습니다. 나중에 필터를 바꾸거나 없애도 원본은 그대로입니다.
      - q: 사진이 없는 날도 있어요
        a: 괜찮습니다. 사진 대신 종이 한 장을 고를 수도 있고, 아무것도 얹지 않아도 됩니다.
  - label: 기록 지키기
    items:
      - q: 기기를 바꾸면 기록이 따라오나요
        a: <strong>자동으로는 따라오지 않습니다.</strong> 기록은 이 기기 안에만 있습니다. 기기를 바꾸기 전에 <strong>설정 ＞ 내 기록 백업하기</strong>로 백업을 만들고, 새 기기에서 <strong>iCloud Drive 에서 되살리기</strong>를 누르세요.
      - q: 백업은 어디에 만들어지나요
        a: iCloud Drive 의 「FiveLeaf」 폴더입니다. 파일 앱에서 볼 수 있고, <strong>앱을 지워도 그 파일은 남습니다.</strong> 백업은 한 벌만 두므로 새로 만들면 지난 백업을 대신합니다.
      - q: 백업은 얼마나 자주 해야 하나요
        a: 정해진 주기는 없습니다. 매달 1일 아침에 지난달을 돌아보라는 알림이 가고, 그달에 백업하지 않았으면 그 한 줄이 함께 옵니다.
      - q: 복원하면 지금 기록이 지워지나요
        a: 아니요. 복원은 <strong>더하기만 합니다.</strong> 같은 날이 이미 있으면 그 날은 건너뛰고 지금 있는 것을 그대로 둡니다. 끝나면 몇 건을 되살렸고 몇 건을 두었는지 알려줍니다.
      - q: 백업 파일을 다른 곳에 두고 싶어요
        a: <strong>설정 ＞ 내 기록 내보내기</strong>를 쓰면 같은 파일을 어디로든 보낼 수 있습니다. 그 파일을 앱으로 열면 되살릴 수 있습니다.
      - q: 백업 파일 안에 무엇이 들어 있나요
        a: 기록 전부입니다 — 글자·사진·영상·시각·장소·색. <code>memories.json</code> 은 그냥 글자이고 사진과 영상은 보통의 파일이라, 「다섯 글자」 없이도 열어볼 수 있습니다. 확장자를 <code>.zip</code> 으로 바꾸면 어디서나 풀립니다.
  - label: 잠금과 알림
    items:
      - q: 특정 기록만 감추고 싶어요
        a: 상세 화면에서 잠글 수 있습니다. 잠근 날은 글자·사진·시각·장소가 모두 가려지고, 풀 때 Face ID 나 암호로 확인합니다.
      - q: 알림 시간을 바꾸고 싶어요
        a: <strong>설정 ＞ Daily Reminder</strong> 에서 시간을 정하거나 끕니다. 처음 시작할 때 저녁 9시로 켜집니다.
      - q: 알림이 오지 않아요
        a: iPhone 설정 ＞ 알림 ＞ 「다섯 글자」에서 알림이 허용되어 있는지 확인하세요. 처음에 허용하지 않았다면 그곳에서 다시 켤 수 있습니다.
  - label: 개인정보
    items:
      - q: 기록이 서버로 가나요
        a: 아니요. 이 앱에는 서버가 없습니다. 기록은 이 기기 안에만 있고, 백업을 만들 때만 당신의 iCloud Drive 로 갑니다 — 그것도 당신이 누를 때만입니다.
      - q: 장소는 어떻게 알아내나요
        a: 위치를 켠 날에만 좌표를 애플의 지도 서비스에 보내 <strong>도시 이름</strong>을 받아옵니다. 좌표와 도시 이름은 그 기록에 저장되고 그 밖으로 나가지 않습니다.
      - q: 앱을 지우면 어떻게 되나요
        a: 기기 안의 기록은 함께 사라집니다. <strong>iCloud Drive 의 백업 파일은 남습니다.</strong>

