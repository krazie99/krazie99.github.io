product_name: 한글키
product_note: 한글 키보드
meta_title: 한글키 고객지원
meta_description: 한글 키보드 한글키의 사용법, 자주 묻는 질문, 문의 안내.

hero_eyebrow: 고객지원
hero_title: 궁금한 점을 여기서 해결하세요.
hero_body: 자판 설정과 한글 입력에 대해 자주 묻는 질문을 모았습니다. 여기서 답을 찾지 못하면 아래 항목을 적어 메일이나 카페로 알려주세요.

setup_label: 처음 설정
setup_note: 키보드는 추가만 해서는 쓸 수 없습니다. 세 가지를 모두 마쳐야 합니다.
setup_steps:
  - title: 키보드 추가
    body: 설정 ＞ 일반 ＞ 키보드 ＞ 키보드 ＞ 새로운 키보드 추가에서 ‘한글키’를 고릅니다.
  - title: 전체 접근 허용
    body: 같은 화면에서 ‘한글키’를 누르고 ‘전체 접근 허용’을 켭니다. 자판 변경과 테마는 이걸 켜야 반영됩니다.
  - title: 지구본 키로 전환
    body: 입력창에서 지구본(🌐) 키를 길게 눌러 한글키를 고릅니다.

faq_label: 자주 묻는 질문
faq:
  - label: 시작하기
    items:
      - q: 키보드 목록에 ‘한글키’가 없어요
        a: 한글키 앱을 한 번 실행한 뒤 설정 ＞ 일반 ＞ 키보드 ＞ 키보드를 다시 열어보세요. 그래도 없으면 iPhone을 재시동하면 목록에 나타납니다.
      - q: ‘전체 접근 허용’은 왜 필요한가요
        a: 앱에서 고른 자판·테마·각종 설정은 앱과 키보드가 함께 쓰는 저장 공간에 들어갑니다. 전체 접근이 꺼져 있으면 키보드가 그곳을 읽지 못해, 자판을 바꿔도 반영되지 않고 기본 상태로만 동작합니다. <strong>입력한 글자를 밖으로 보내지 않습니다.</strong>
      - q: 설정을 바꿨는데 키보드는 그대로예요
        a: 먼저 ‘전체 접근 허용’이 켜져 있는지 확인하세요. 켜져 있다면 키보드를 닫았다가 다시 열면 반영됩니다.
  - label: 자판과 입력
    items:
      - q: 자판을 바꾸고 싶어요
        a: 앱의 <strong>한글키 ＞ 한국어 키보드</strong>에서 고릅니다. 단모음·무이단모음·한글두벌식·천지인 계열·나랏글 계열·스카이를 지원합니다.
      - q: 지구본 키로 도는 키보드 순서를 바꾸고 싶어요
        a: 앱의 <strong>한글키 ＞ 키보드 언어 전환</strong>에서 전환할 키보드와 순서를 정합니다.
      - q: 자주 쓰는 문구를 키에 넣고 싶어요
        a: <strong>보조키 설정</strong> 탭에서 키마다 넣을 문자와 문구를 등록합니다. 키를 길게 누르거나 아래로 스와이프하면 나옵니다.
      - q: 학습된 단어 추천을 지우고 싶어요
        a: <strong>기본 설정 ＞ 공통 · 추천 ＞ 학습된 단어 추천 초기화</strong>로 자주 쓰는 단어와 다음 단어 예측 기록을 모두 지웁니다. 되돌릴 수 없습니다.
      - q: 커서를 옮기고 싶어요
        a: <strong>기본 설정 ＞ 공통 · 제스처 ＞ 화면 전체 스와이프로 커서 이동</strong>을 켜면 키보드 전체를 좌우로 쓸어 커서를 옮깁니다. 이때 키를 좌우로 스와이프하는 복합 모음 입력은 쓸 수 없습니다.
  - label: 한글키 Pro
    items:
      - q: Pro로 무엇이 열리나요
        a: 오타 수정, 일본어 키보드, 한자 변환, 번역, 카오모지·꾸밈 텍스트, 클립보드가 열립니다. <strong>한 번 결제로 계속 씁니다.</strong> 기존 한글 입력과 테마·폰트는 결제 없이도 그대로 무료입니다.
      - q: 구매를 복원하고 싶어요
        a: 구매할 때 쓴 Apple 계정으로 App Store에 로그인한 뒤, 앱의 <strong>👑 Pro 잠금해제</strong> 화면에서 ‘구매 복원’을 누르세요.
      - q: 번역 버튼이 눌리지 않아요
        a: 번역은 <strong>iOS 26 이상 · Pro · 언어팩 설치</strong> 세 가지가 모두 맞을 때만 켜집니다. 언어팩은 앱의 ‘번역 언어’ 화면에서 내려받으세요. 키보드에서는 내려받을 수 없습니다.
      - q: 오타 수정은 자동으로 고쳐주나요
        a: 아니요. 커서 앞 문장을 다듬어 후보로 보여주고, 고를 때만 바뀝니다. 잘못 고치는 쪽이 안 고치는 쪽보다 나쁘기 때문에 자동 적용하지 않습니다.
  - label: 테마
    items:
      - q: 테마를 가져오고 싶어요
        a: 카페의 테마 공유 게시판에서 테마를 복사한 뒤, 앱의 <strong>테마/키보드</strong> 탭에서 테마 가져오기를 누르세요.
  - label: 개인정보
    items:
      - q: 입력한 글자가 서버로 가나요
        a: 아니요. 변환·학습·오타 수정·번역은 모두 iPhone 안에서 처리합니다. 번역은 애플의 번역 기능을 쓰기 때문에 이것도 네트워크를 타지 않습니다. 앱 이용 통계(화면 이동·비정상 종료)는 모으지만 입력한 글자와 이어지지 않습니다.
      - q: 학습한 데이터와 클립보드 기록은 어디에 있나요
        a: iPhone 안에만 있습니다. 앱을 지우면 함께 사라집니다.

contact_title: 해결되지 않았나요?
contact_body: 아래 내용을 함께 보내주시면 원인을 바로 찾을 수 있습니다. 입력했던 문장이나 비밀번호 같은 개인정보는 보내지 마세요.
contact_checklist:
