meta_title: カナジ サポート
meta_description: 日本語キーボード「カナジ」の使い方、よくある質問、お問い合わせ窓口。

hero_eyebrow: サポート
hero_title: 困ったときは、ここから。
hero_body: カナジの設定と日本語入力について、よくある質問をまとめました。ここで解決しないときは、下の項目を添えてメールでお知らせください。

setup_label: はじめの設定
setup_note: キーボードは追加しただけでは使えません。3つとも済ませてください。
setup_steps:
  - title: キーボードを追加する
    body: 設定 ＞ 一般 ＞ キーボード ＞ キーボード ＞ 新しいキーボードを追加 で「カナジ」を選びます。
  - title: フルアクセスを許可する
    body: 同じ画面で「カナジ」をタップし、「フルアクセスを許可」をオンにします。テーマと各種設定はこれをオンにしないと反映されません。
  - title: 地球儀キーで切り替える
    body: 文字入力欄で地球儀（🌐）キーを長押しし、カナジを選びます。

faq_label: よくある質問
faq:
  - label: はじめに
    items:
      - q: キーボードの一覧に「カナジ」が出てきません
        a: 先にカナジのアプリを一度開いてから、設定 ＞ 一般 ＞ キーボード ＞ キーボード を開き直してください。それでも出ないときは、iPhone を再起動すると一覧に現れます。
      - q: 「フルアクセスを許可」は何のために必要ですか
        a: アプリで選んだテーマ・キーボードの並び・各種設定は、アプリとキーボードが共有する保存領域に入ります。フルアクセスがオフだとキーボードはそこを読めないため、設定が反映されず初期状態のまま動きます。<strong>入力した文字を外部に送ることはありません。</strong>
      - q: 設定を変えたのに、キーボードが前のままです
        a: まず「フルアクセスを許可」がオンか確かめてください。オンであれば、キーボードをいったん閉じてもう一度開くと反映されます。
  - label: 日本語入力
    items:
      - q: フリック入力とローマ字入力を切り替えたい
        a: アプリの <strong>カナジ ＞ ローマ字入力</strong> で切り替えます。オフにすると、かな入力（フリック）のキーボードになります。
      - q: 変換候補に出したい単語があります
        a: <strong>入力設定 ＞ 日本語 ＞ ユーザ辞書</strong> で「よみ」と「表記」を登録すると、その語が変換候補の先頭に出ます。
      - q: 学習した変換候補を消したい
        a: <strong>入力設定 ＞ 共通 · 変換候補 ＞ 学習した候補をリセット</strong> で、よく使う語と次の語の予測の記録をすべて消せます。元には戻せません。
      - q: 絵文字の候補を出したくありません
        a: <strong>入力設定 ＞ 共通 · 変換候補 ＞ 絵文字の候補</strong> をオフにしてください。
  - label: カナジ Pro
    items:
      - q: カナジ Pro で何ができますか
        a: 韓国語キーボード（ハングル2ボル式・天地人テンキー）、翻訳、顔文字・装飾テキスト、誤字修正、クリップボードが開きます。<strong>一度の購入でずっと使えます。</strong>日本語入力・テーマ・フォントは購入しなくても無料です。
      - q: 購入を復元したいです
        a: 購入時と同じ Apple Account で App Store にサインインし、アプリの <strong>👑 カナジ Pro</strong> 画面で「購入を復元」を押してください。
      - q: 翻訳ボタンが押せません
        a: 翻訳は <strong>iOS 26 以降・カナジ Pro・言語パックのインストール</strong> の3つがそろったときだけ使えます。言語パックはアプリの「翻訳する言語」からダウンロードしてください。キーボード側からはダウンロードできません。
  - label: プライバシー
    items:
      - q: 入力した文字は送信されますか
        a: いいえ。変換・学習・誤字修正・翻訳は、すべて iPhone の中だけで処理します。翻訳は Apple の翻訳機能を使うため、こちらもネットワークを通りません。アプリの利用状況（画面の遷移やクラッシュ）の統計は集めますが、入力した文字とは結びつきません。
      - q: 学習したデータはどこにありますか
        a: iPhone の中だけにあります。アプリを削除すると一緒に消えます。

contact_title: 解決しないときは
contact_body: 次の内容を添えていただけると、原因をすぐ調べられます。入力した文章やパスワードなど、個人情報は送らないでください。
