product_name: 카나지
product_note: 일본어 키보드
meta_title: 카나지 고객지원
meta_description: 일본어 키보드 카나지의 사용법, 자주 묻는 질문, 문의 안내.

hero_eyebrow: 고객지원
hero_title: 궁금한 점을 여기서 해결하세요.
hero_body: 카나지 설정과 일본어 입력에 대해 자주 묻는 질문을 모았습니다. 여기서 답을 찾지 못하면 아래 항목을 적어 메일로 알려주세요.

setup_label: 처음 설정
setup_note: 키보드는 추가만 해서는 쓸 수 없습니다. 세 가지를 모두 마쳐야 합니다.
setup_steps:
  - title: 키보드 추가
    body: 설정 ＞ 일반 ＞ 키보드 ＞ 키보드 ＞ 새로운 키보드 추가에서 ‘카나지’를 고릅니다.
  - title: 전체 접근 허용
    body: 같은 화면에서 ‘카나지’를 누르고 ‘전체 접근 허용’을 켭니다. 테마와 각종 설정은 이걸 켜야 반영됩니다.
  - title: 지구본 키로 전환
    body: 입력창에서 지구본(🌐) 키를 길게 눌러 카나지를 고릅니다.

faq_label: 자주 묻는 질문
faq:
  - label: 시작하기
    items:
      - q: 키보드 목록에 ‘카나지’가 없어요
        a: 카나지 앱을 한 번 실행한 뒤 설정 ＞ 일반 ＞ 키보드 ＞ 키보드를 다시 열어보세요. 그래도 없으면 iPhone을 재시동하면 목록에 나타납니다.
      - q: ‘전체 접근 허용’은 왜 필요한가요
        a: 앱에서 고른 테마·자판 순서·각종 설정은 앱과 키보드가 함께 쓰는 저장 공간에 들어갑니다. 전체 접근이 꺼져 있으면 키보드가 그곳을 읽지 못해, 설정이 반영되지 않고 기본 상태로만 동작합니다. <strong>입력한 글자를 밖으로 보내지 않습니다.</strong>
      - q: 설정을 바꿨는데 키보드는 그대로예요
        a: 먼저 ‘전체 접근 허용’이 켜져 있는지 확인하세요. 켜져 있다면 키보드를 닫았다가 다시 열면 반영됩니다.
  - label: 일본어 입력
    items:
      - q: 플릭 입력과 로마자 입력을 바꾸고 싶어요
        a: 앱의 <strong>카나지 ＞ 로마자 입력</strong>에서 바꿉니다. 끄면 가나 직접입력(플릭) 키보드가 됩니다.
      - q: 변환 후보에 넣고 싶은 단어가 있어요
        a: <strong>입력 설정 ＞ 일본어 ＞ 사용자 사전</strong>에서 읽기와 표기를 등록하면 변환 후보 맨 앞에 나옵니다.
      - q: 학습된 변환 후보를 지우고 싶어요
        a: <strong>입력 설정 ＞ 공통 · 변환 후보 ＞ 학습한 후보 초기화</strong>로 자주 쓰는 단어와 다음 단어 예측 기록을 모두 지웁니다. 되돌릴 수 없습니다.
      - q: 이모지 추천이 안 나왔으면 해요
        a: <strong>입력 설정 ＞ 공통 · 변환 후보 ＞ 이모지 후보</strong>를 꺼주세요.
  - label: 카나지 Pro
    items:
      - q: 카나지 Pro로 무엇이 열리나요
        a: 한국어 키보드(한글두벌식·천지인 10키), 번역, 카오모지·꾸밈 텍스트, 오타 수정, 클립보드가 열립니다. <strong>한 번 결제로 계속 씁니다.</strong> 일본어 입력과 테마·폰트는 결제 없이도 그대로 무료입니다.
      - q: 구매를 복원하고 싶어요
        a: 구매할 때 쓴 Apple 계정으로 App Store에 로그인한 뒤, 앱의 <strong>👑 카나지 Pro</strong> 화면에서 ‘구매 복원’을 누르세요.
      - q: 번역 버튼이 눌리지 않아요
        a: 번역은 <strong>iOS 26 이상 · 카나지 Pro · 언어팩 설치</strong> 세 가지가 모두 맞을 때만 켜집니다. 언어팩은 앱의 ‘번역할 언어’ 화면에서 내려받으세요. 키보드에서는 내려받을 수 없습니다.
  - label: 개인정보
    items:
      - q: 입력한 글자가 서버로 가나요
        a: 아니요. 변환·학습·오타 수정·번역은 모두 iPhone 안에서 처리합니다. 번역은 애플의 번역 기능을 쓰기 때문에 이것도 네트워크를 타지 않습니다. 앱 이용 통계(화면 이동·비정상 종료)는 모으지만 입력한 글자와 이어지지 않습니다.
      - q: 학습한 데이터는 어디에 있나요
        a: iPhone 안에만 있습니다. 앱을 지우면 함께 사라집니다.

contact_title: 해결되지 않았나요?
contact_body: 아래 내용을 함께 보내주시면 원인을 바로 찾을 수 있습니다. 입력했던 문장이나 비밀번호 같은 개인정보는 보내지 마세요.
contact_checklist:
  - 카나지 버전
  - iPhone 기종과 iOS 버전
  - 문제가 생기기까지의 순서
  - 가능하면 화면 스크린샷
contact_action: 이메일로 문의하기

